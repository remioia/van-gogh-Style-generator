<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Art à la manière de Van Gogh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e222b;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #282c34;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 {
            color: #e5c07b;
            text-align: center;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #abb2bf;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #4b5263;
            border-radius: 6px;
            background-color: #abb2bf;
            color: #1e222b;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #5c6370;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #61afef;
            color: #1e222b;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4fa4e0;
        }
        button:disabled {
            background-color: #5c6370;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 25px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
            margin-top: 15px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #61afef;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e06c75;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Générateur d'Art : Style Van Gogh</h1>
    
    <div class="form-group">
        <label for="apiKey">Clé API Pollinations</label>
        <input type="password" id="apiKey" placeholder="Entrez votre clé API issue de Pollinations.ai">
    </div>

    <div class="form-group">
        <label for="prompt">Sujet de l'œuvre</label>
        <input type="text" id="prompt" placeholder="Ex: Une nuit étoilée sur la tour Eiffel, un chat au café...">
    </div>

    <button id="generateBtn" onclick="generateImage()">Générer l'œuvre d'art</button>

    <div class="result-box">
        <div class="loader" id="loader"></div>
        <p id="statusText">Entrez vos informations et cliquez sur Générer.</p>
        <div class="error" id="errorText"></div>
        <img id="outputImage" src="" alt="Œuvre générée dans le style Van Gogh">
    </div>
</div>

<script>
    async function generateImage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userPrompt = document.getElementById('prompt').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');
        const errorText = document.getElementById('errorText');
        const outputImage = document.getElementById('outputImage');

        // Réinitialisation de l'affichage
        errorText.innerText = "";
        outputImage.style.display = "none";
        
        if (!apiKey) {
            errorText.innerText = "Erreur : Veuillez renseigner votre clé API Pollinations.";
            return;
        }
        if (!userPrompt) {
            errorText.innerText = "Erreur : Veuillez décrire ce que vous souhaitez générer.";
            return;
        }

        // Activation de l'état de chargement
        generateBtn.disabled = true;
        loader.style.display = "block";
        statusText.innerText = "Création de l'œuvre en cours (Style Van Gogh)...";

        // Construction du prompt enrichi avec le style requis par l'énoncé
        const fullPrompt = encodeURIComponent(`${userPrompt}, oil painting, thick brush strokes, vibrant swirling colors, post-impressionism style by Vincent van Gogh`);
        
        // Configuration de l'endpoint Pollinations avec les paramètres (Modèle Z image / Flux / etc.)
        // Note : Pollinations utilise généralement la structure d'URL directe ou des headers d'autorisation pour les clés API de dev.
        const endpointUrl = `https://image.pollinations.ai/p/${fullPrompt}?width=1024&height=1024&model=flux&seed=${Math.floor(Math.random() * 1000000)}`;

        try {
            // Requête vers l'API en injectant la clé dans les headers d'autorisation comme requis pour les comptes développeurs
            const response = await fetch(endpointUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${apiKey}`
                }
            });

            if (!response.ok) {
                throw new Error(`Erreur serveur (${response.status}). Vérifiez votre clé API.`);
            }

            // Récupération de l'image sous forme de Blob
            const imageBlob = await response.blob();
            const imageObjectURL = URL.createObjectURL(imageBlob);

            // Affichage du résultat
            outputImage.src = imageObjectURL;
            outputImage.style.display = "block";
            statusText.innerText = "Œuvre générée avec succès !";

        } catch (error) {
            console.error(error);
            errorText.innerText = "Une erreur est survenue lors de la génération : " + error.message;
            statusText.innerText = "Échec de la génération.";
        } finally {
            // Désactivation de l'état de chargement
            generateBtn.disabled = false;
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
